name: Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate version tag and Xcode
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vX.Y.Z.' >&2
            exit 1
          fi
          xcodebuild -version
          xcode_version="$(xcodebuild -version)"
          [[ "$xcode_version" == "Xcode 27."* ]]
          echo "number=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and verify DMG
        shell: bash
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          bash .codex/skills/build-release/scripts/build-release.sh \
            --version "$VERSION_NUMBER" \
            --output-dir dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          filename="RepoMan-${RELEASE_TAG}-macOS-arm64-adhoc.dmg"
          gh release create "$RELEASE_TAG" \
            "dist/$filename" \
            "dist/$filename.sha256" \
            --verify-tag \
            --generate-notes \
            --title "RepoMan $RELEASE_TAG" \
            --notes 'Ad-hoc-signed build for macOS 27 or later on Apple Silicon. This app is not notarized; macOS Gatekeeper may require manual approval.'
